<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c11" />
    <meta name="description" content="KaryaLink - Site-to-Schedule Intelligence. Links messy site progress updates to L5/L6 schedule activities with calibrated confidence and a tamper-evident audit trail." />
    <meta name="application-name" content="KaryaLink" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>KaryaLink · Site-to-Schedule Intelligence</title>
    <script>
      // dark is the default; a saved choice wins
      try {
        const t = localStorage.getItem("karyalink-theme");
        document.documentElement.classList.toggle("dark", t ? t === "dark" : true);
      } catch (e) {}
    </script>
  </head>
  <body class="text-ink-900 dark:text-ink-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
